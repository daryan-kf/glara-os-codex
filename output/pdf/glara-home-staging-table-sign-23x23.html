<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Glara Home Staging — Exhibition Table Sign — 23 x 23 inches</title>
<style>
@page { size: 23in 23in; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 23in; height: 23in; }
body { background: #f8f5ef; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sign { width: 23in; height: 23in; position: relative; overflow: hidden; color: #6b5a4d; }
.frame { position: absolute; inset: .55in; border: 1.5pt solid #b39b88; z-index: 2; pointer-events: none; }
.brand { position: absolute; top: 1.65in; left: 3.65in; width: 15.7in; }
.brand svg { display: block; width: 100%; height: auto; overflow: visible; }
.brand svg .mono, .brand svg .word, .brand svg .sub { font-family: Georgia, serif; }
.tagline { position: absolute; left: 1in; right: 1in; top: 16.9in; margin: 0; text-align: center; font: 36pt/1.35 Georgia, serif; letter-spacing: .025em; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 3.85in; background: #173f35; color: #f8f5ef; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .24in; padding-bottom: .14in; }
.footer .region { margin: 0; font: 20pt/1.2 Arial, sans-serif; letter-spacing: .24em; }
.footer .web { margin: 0; font: 43pt/1.25 Georgia, serif; letter-spacing: .045em; }
</style></head><body><main class="sign" aria-label="Glara Home Staging exhibition table sign">
<div class="frame"></div><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" width="400" height="348" role="img" aria-label="GLARA Home Staging">
  <title>GLARA Home Staging</title>
  <style>
    .stroke { fill: none; stroke: #a9907c; stroke-width: 7; }
    .pane, .mono { fill: #b39b88; }
    .word { fill: #6b5a4d; }
    .sub  { fill: #a9907c; }
    .rule { stroke: #a9907c; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .stroke { stroke: #c9b19c; }
      .pane, .mono { fill: #c9b19c; }
      .word { fill: #ece1d6; }
      .sub  { fill: #bda78f; }
      .rule { stroke: #bda78f; }
    }
  </style>

  <!-- Monogram: open G, roofline with window, serif H -->
  <g transform="translate(79 13)">
    <path class="stroke" d="M125 153.2 A82.5 82.5 0 1 1 164.7 89.7" stroke-linecap="butt" />
    <path class="stroke" d="M5 190 L77.5 115 L118 155.5" stroke-linejoin="miter" stroke-linecap="butt" />
    <g class="pane">
      <rect x="64.7" y="149.7" width="14" height="12" />
      <rect x="83.2" y="149.7" width="14" height="12" />
      <rect x="64.7" y="165.2" width="14" height="12" />
      <rect x="83.2" y="165.2" width="14" height="12" />
    </g>
    <text class="mono" x="162" y="197" text-anchor="middle"
          font-family="'Cormorant Garamond','Playfair Display',Didot,'Bodoni MT',Georgia,'Times New Roman',serif"
          font-size="190">H</text>
  </g>

  <!-- Wordmark. `x` is nudged right of centre because SVG letter-spacing also
       applies after the final glyph, which otherwise pulls the block left. -->
  <text class="word" x="210" y="290" text-anchor="middle"
        font-family="'Cormorant Garamond','Playfair Display',Didot,'Bodoni MT',Georgia,'Times New Roman',serif"
        font-size="72" letter-spacing="20">GLARA</text>

  <line class="rule" x1="154" y1="308" x2="246" y2="308" />

  <text class="sub" x="203" y="336" text-anchor="middle"
        font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif"
        font-size="16" letter-spacing="7">HOME STAGING</text>
</svg>
</div>
<p class="tagline">Beautiful Spaces. Stronger Results.</p>
<footer class="footer"><p class="region">METRO VANCOUVER</p><p class="web">glarahome.com</p></footer>
</main></body></html>
