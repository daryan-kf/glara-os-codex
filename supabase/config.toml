project_id = "glara-os"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12
[auth.email]
# Email provider stays enabled; auth.enable_signup blocks public registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[auth.email.template.recovery]
subject = "Reset your Glara OS password"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.invite]
subject = "Your invitation to Glara OS"
content_path = "./supabase/templates/invite.html"
